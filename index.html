/* Local staff account interface */
#app.authscreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 25% 5%,#12315c 0%,transparent 45%),#0b111d;color:#e7effc}
.login-card{width:min(430px,100%);background:#141f31;border:1px solid #2c405d;border-radius:20px;padding:32px;box-shadow:0 25px 100px #0007}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:27px}.login-brand .brandmark{flex:none}
.login-card h1{font-size:25px;letter-spacing:-.7px;margin:0 0 7px}.login-card p{color:#a4b3c9;line-height:1.6;margin:0 0 22px}
.login-card .field{margin-bottom:15px}.login-card .field input{width:100%;background:#0e192a;color:#edf4ff;border:1px solid #3b4f6a;border-radius:10px;padding:13px;outline-color:#79a8ff}
.login-card .field label{color:#c8d5e7}.login-card .primary{width:100%;padding:13px;margin-top:6px}.login-card .error{background:#442635;border:1px solid #754454;color:#ffc2cf;padding:11px;border-radius:9px;margin:10px 0}
.login-card .login-note{font-size:12px;color:#94a7c2;margin-top:18px;padding-top:17px;border-top:1px solid #2a3d57}
.user-chip{padding:8px 11px;color:#bacee6;font-weight:650;white-space:nowrap}.staffgrid{display:grid;gap:12px}.staffitem{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid #354760;border-radius:11px;padding:14px;flex-wrap:wrap}
@media(max-width:800px){.login-card{padding:23px}.user-chip{font-size:12px}.topright{flex-wrap:wrap}}

/* V1.5: compact, clearer workshop design */
.workshop-banner{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;background:linear-gradient(120deg,#182b49,#14223a);border:1px solid #354a6b;border-radius:14px;padding:18px 21px;margin:0 0 22px;color:#f2f7ff}
.workshop-banner strong{display:block;font-size:15px;margin-bottom:5px}.workshop-banner span{font-size:12px;color:#a6bad5}
.workshop-banner .ghost,.workshop-banner .secondary{background:#233b60;color:#f1f7ff;border-color:#435c7b}
body:not(.dark) .workshop-banner{background:linear-gradient(120deg,#eaf2ff,#dbe9ff);color:#173a69;border-color:#c8dbf6}body:not(.dark) .workshop-banner span{color:#58749b}
body:not(.dark) .workshop-banner .ghost,body:not(.dark) .workshop-banner .secondary{background:white;color:#2054a1;border-color:#bcd0eb}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #72abff;outline-offset:2px}
@media(max-width:800px){.topright{justify-content:flex-end}.topright .ghost{padding:8px}.workshop-banner{padding:15px}.workshop-banner .tools{width:100%}.workshop-banner .tools button{flex:1}}
